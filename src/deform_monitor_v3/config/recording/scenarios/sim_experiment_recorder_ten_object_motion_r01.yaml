recording_mode: formal
algorithm_storage_backend: sqlite_zlib
truth_frame: world
algorithm_frame: camera_init
ego_model_name: mid360_fastlio
model_states_topic: /gazebo/model_states
link_states_topic: /gazebo/link_states
truth_object_rate_hz: 10.0
truth_link_rate_hz: 10.0
surface_truth_link_prefixes: [ground_truth_]
surface_truth_catalog_source: world_static_marker_visual
surface_truth_world_file: package://livox_laser_simulation/worlds/tracked_mid360_fastlio_collapse_microdeform_sim.world
surface_truth_expected_count: 106
surface_truth_max_local_radius_m: 3.0
surface_truth_require_clean_world: true
# Gazebo's micro-mass ground_truth_* child links are catalog markers, not a
# stable dynamic truth source. Record the ten kinematic collision-bearing links
# and reconstruct all surface points from their pre-motion parent-local poses.
record_surface_truth_link_trajectories: false
motion_truth_drive_links:
  l_shape_target: l_shape_target::link
  model_01: model_01::link
  model_02: model_02::link
  table: table::link
  table_marble: table_marble::link
  person_walking: person_walking::link
  table_clone: table_clone::link
  cardboard_box: cardboard_box::link
  lzg_bianwood: lzg_bianwood::link_0
  bookshelf: bookshelf::link
record_flush_interval_sec: 1.0
record_flush_max_rows: 1000
# Gazebo truth callbacks only sample and enqueue. CSV/JSONL I/O is drained by
# a dedicated writer so callback transport does not collapse below 10 Hz.
truth_subscriber_queue_size: 64
truth_processing_queue_size: 256
truth_processing_enqueue_timeout_sec: 2.0
# /deform/anchors contains thousands of anchors per frame. The ROS queue absorbs
# transport jitter; the recorder-owned queue is drained losslessly at shutdown.
anchor_subscriber_queue_size: 64
anchor_processing_queue_size: 64
anchor_processing_enqueue_timeout_sec: 2.0
truth_motion_policy:
  translation_deadband_m: 0.001
  rotation_deadband_deg: 0.05
  linear_speed_deadband_mps: 0.0005
  angular_speed_deadband_degps: 0.01
  sustained_motion_samples: 2
risk_evidence_topic: /deform/risk_evidence
risk_regions_topic: /deform/risk_regions
persistent_risk_regions_topic: /deform/persistent_risk_regions
structure_motions_topic: /deform/structure_motions
ground_truth_odometry_topic: /ground_truth/odom
clusters_topic: /deform/clusters
object_observation_stats_topic: /deform/object_observation_stats
odometry_topic: /Odometry
sensor_frame_name: livox
sensor_scoped_link_name: ""
gt_tum_filename: gt_sensor_world_tum.txt
odom_tum_filename: odom_raw_tum.txt
deform_monitor_param_root: /deform_monitor_v3
deform_monitor_config_path: ""

object_id_catalog:
  "1": l_shape_target
  "2": model_01
  "3": model_02
  "4": table
  "5": table_marble
  "6": person_walking
  "7": table_clone
  "8": cardboard_box
  "9": lzg_bianwood
  "10": bookshelf
