  "12": lzg_grey_wall
  "13": wooden_case_metal_peg
  "14": cardboard_box_0
  "15": bookshelf_0
  "16": lzg_three_zhuzi
  "17": cardboard_box_clone
  "18": cardboard_box_1
  "19": lzg_bianwood_clone
  "20": lzg_bianwood_clone_0
  "21": lzg_bianwood_clone_1
  "22": grey_wall
  "23": grey_wall_0
  "24": ground_plane
  "25": lzg_wall

scenario_id: collapse_microdeform_sim_10obj_mixed_l1mmps_w0p0015radps_static_r01
experiment_factors:
  scene_id: tracked_mid360_fastlio_collapse_microdeform_sim
  moving_object_quantity: 10
  scene_object_quantity: 25
  platform_condition: static
  slam_pipeline: fast_lio
  point_cloud_setting: mid360_sim_default
  repeat_index: 1
  rigid_motion_only: true
  motion_profile: mixed_constant_translation_rotation
  motion_protocol_version: alert_plusplus10obj_mixed_rotation_v4
  truth_protocol_version: gazebo_drive_link_pose_static_surface_catalog_v3
  rotation_speed_policy: global_uniform
  rotating_object_ids: [1, 2, 5, 7, 9]
  translating_object_ids: [3, 4, 8, 10]
  fixed_speed_object_ids: [6]
  motion_direction: mixed
  visibility_condition: scene_dependent
  linear_speed_mm_s: 1.0
  angular_speed_rad_s: 0.0015
  planned_rotation_angle_rad: 0.06
  start_delay_sec: 10.0
  motion_duration_sec: 40.0
  end_hold_sec: 10.0
  experiment_duration_sec: 60.0

# Size classes describe the collision envelope used by this world: small
# (<0.75 m), medium (0.75-1.5 m), and large (>1.5 m maximum dimension).
# Visibility is measured from the recorded per-object LiDAR exposure rather
# than asserted as a fixed clear/occluded label.
object_metadata:
  l_shape_target:
    shape: l_shape_composite
    size_class: large
    motion_profile: constant_rotation
    motion_direction: positive_world_z_rotation
    visibility_condition: scene_dependent
  model_01:
    shape: rectangular_prism
    size_class: large
    motion_profile: constant_rotation
    motion_direction: negative_world_z_rotation
    visibility_condition: scene_dependent
  model_02:
    shape: rectangular_prism
    size_class: large
    motion_profile: constant_translation
    motion_direction: positive_world_x
    visibility_condition: scene_dependent
  table:
    shape: table_with_cylindrical_legs
    size_class: medium
    motion_profile: constant_translation
    motion_direction: positive_world_y
    visibility_condition: scene_dependent
  table_marble:
    shape: marble_table_mesh
    size_class: medium
    motion_profile: constant_rotation
    motion_direction: negative_world_y_rotation_top_toward_positive_world_z
    visibility_condition: scene_dependent
  person_walking:
    shape: rigid_human_mesh
    size_class: medium
    motion_profile: fixed_speed_translation
    motion_direction: negative_world_y
    visibility_condition: scene_dependent
  table_clone:
    shape: table_with_cylindrical_legs
    size_class: medium
    motion_profile: constant_rotation
    motion_direction: positive_world_z_rotation
    visibility_condition: scene_dependent
  cardboard_box:
    shape: rectangular_box
    size_class: small
    motion_profile: constant_translation
    motion_direction: positive_world_x
    visibility_condition: scene_dependent
  lzg_bianwood:
    shape: thin_rectangular_panel
    size_class: large
    motion_profile: constant_rotation
    motion_direction: negative_world_x_rotation
    visibility_condition: scene_dependent
  bookshelf:
    shape: shelving_unit
    size_class: medium
    motion_profile: constant_translation
    motion_direction: positive_world_y
    visibility_condition: scene_dependent

# The synchronized Gazebo world plugin is authoritative for the actual motion.
# No single-object fallback command is used.
controlled_object: ""
command_frame: ""
linear_velocity_x: 0.0
linear_velocity_y: 0.0
linear_velocity_z: 0.0
angular_velocity_x_deg: 0.0
angular_velocity_y_deg: 0.0
angular_velocity_z_deg: 0.0
control_axis_x: 0.0
control_axis_y: 0.0
control_axis_z: 0.0
control_start_delay_sec: ""
control_duration_sec: ""
