local_costmap:
  global_frame: camera_init
  robot_base_frame: navigation_base
  transform_tolerance: 0.5
  update_frequency: 10.0
  publish_frequency: 3.0
  static_map: false
  rolling_window: true
  width: 8.0
  height: 8.0
  # Match the SLAM/global lattice; this does not change detector resolution.
  resolution: 0.15
  footprint: [[0.36, 0.30], [0.36, -0.30], [-0.36, -0.30], [-0.36, 0.30]]
  footprint_padding: 0.01
  always_send_full_costmap: true
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  # DWA sees the same finite deformation costs as the global planner, while
  # live LiDAR observations continue to mark/clear real local obstacles.
  static_layer:
    map_topic: /mission/navigation_map
    subscribe_to_updates: false
    first_map_only: false
    track_unknown_space: true
    unknown_cost_value: -1
    lethal_cost_threshold: 100
    trinary_costmap: false
  obstacle_layer:
    enabled: true
    observation_sources: registered_cloud
    registered_cloud:
      data_type: PointCloud2
      # Known A2 self returns are removed in the calibrated FAST-LIO body
      # frame.  Without this step they become permanent static obstacles at
      # the start pose and make the first free-space frontier unreachable.
      topic: /navigation/cloud_registered_body
      sensor_frame: body
      marking: true
      clearing: true
      min_obstacle_height: -0.25
      max_obstacle_height: 1.20
      obstacle_range: 7.0
      raytrace_range: 8.0
      observation_persistence: 0.0
      expected_update_rate: 0.0
      inf_is_valid: false
    track_unknown_space: true
    combination_method: 1
  inflation_layer:
    # Match global geometric stand-off; do not shrink the physical footprint.
    inflation_radius: 1.00
    cost_scaling_factor: 2.0
